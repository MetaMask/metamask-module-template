name: Build, Lint, and Test

on:
  workflow_call:

permissions:
  contents: read

env:
  # How each command below is invoked. Jobs override this when debug logging is
  # enabled, so that commands run through the permission audit rather than
  # directly, without every step needing a second copy of itself.
  RUN: yarn

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ matrix.node-version }}
          cache-node-modules: ${{ matrix.node-version == '26.x' }}

  build:
    name: Build
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26.x]
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ matrix.node-version }}
      - name: Enable permission audit for debug runs
        if: ${{ runner.debug == '1' && matrix.node-version == '26.x' }}
        run: echo 'RUN=yarn audit --verbose' >> "$GITHUB_ENV"
      - name: Build
        run: $RUN build
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  lint:
    name: Lint
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26.x]
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ matrix.node-version }}
      - name: Enable permission audit for debug runs
        if: ${{ runner.debug == '1' && matrix.node-version == '26.x' }}
        run: echo 'RUN=yarn audit --verbose' >> "$GITHUB_ENV"
      - name: Lint
        run: $RUN lint
      - name: Validate RC changelog
        if: ${{ startsWith(github.head_ref, 'release/') }}
        run: $RUN lint:changelog --rc
      - name: Validate changelog
        if: ${{ !startsWith(github.head_ref, 'release/') }}
        run: $RUN lint:changelog
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ matrix.node-version }}
      - name: Enable permission audit for debug runs
        if: ${{ runner.debug == '1' && matrix.node-version == '26.x' }}
        run: echo 'RUN=yarn audit --verbose' >> "$GITHUB_ENV"
      - name: Test
        run: $RUN test
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  compatibility-test:
    name: Compatibility test
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          persist-credentials: false
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies via Yarn
        run: rm yarn.lock && YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn
      - name: Enable permission audit for debug runs
        if: ${{ runner.debug == '1' && matrix.node-version == '26.x' }}
        run: echo 'RUN=yarn audit --verbose' >> "$GITHUB_ENV"
      - name: Test
        run: $RUN test
      - name: Restore lockfile
        run: git restore yarn.lock
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi
